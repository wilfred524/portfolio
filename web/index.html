<!doctype html>
<!-- El idioma por defecto es el inglés; el selector de la página lo cambia en cliente
     y actualiza este atributo. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Wilfred Morales — Backend Developer</title>
    <meta
      name="description"
      content="Backend developer. Electronic signature, credit rules engine and credit scoring, in production for payroll-deduction lending. PHP/Laravel, PostgreSQL and platform security."
    />

    <!-- Open Graph: sharing the link on Slack or LinkedIn should show name, role and image.
         Only one HTML is served, so these stay in English regardless of the language picked. -->
    <meta property="og:type" content="profile" />
    <meta property="og:title" content="Wilfred Morales — Backend Developer" />
    <meta
      property="og:description"
      content="Electronic signature, credit rules engine and credit scoring, in production for payroll-deduction lending. PHP/Laravel, PostgreSQL and platform security."
    />
    <meta property="og:image" content="/davinci.webp" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="es_CO" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Wilfred Morales — Backend Developer" />
    <meta
      name="twitter:description"
      content="Electronic signature, credit rules engine and credit scoring, in production for payroll-deduction lending."
    />
    <meta name="twitter:image" content="/davinci.webp" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
